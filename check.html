<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка доступа · Sky Wool</title>
<!-- Small self-contained page (no external CSS/fonts) to find out what is blocked
     without VPN: the hosting, big files, the Supabase library CDN, Supabase itself, fonts. -->
<style>
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 20px 16px; background: #f6f6f6; color: #2c2c2c; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #505050; font-size: 14px; }
  ol { padding-left: 20px; margin: 0; }
  li { padding: 7px 0; border-bottom: 1px solid #eee; }
  .st { font-weight: 600; }
  .ok { color: #1f7a3a; } .bad { color: #d03b3b; } .wait { color: #8a8a8a; }
  small { color: #8a8a8a; }
  #meta { margin-top: 12px; font-size: 12px; color: #8a8a8a; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Проверка доступа к дашборду</h1>
  <p>Откройте эту страницу <b>без VPN</b>, подождите до 20 секунд, пока все строки не получат ✅ или ❌, и пришлите скриншот.</p>
  <ol id="list"></ol>
  <div id="meta"></div>
</main>
<script type="module">
  const TIMEOUT = 15000;
  const tests = [
    { name: "Сайт: маленький файл", run: () => fetchFile("ping.txt", 1) },
    { name: "Сайт: большой файл (код страницы)", run: () => fetchFile("app.js?check=" + Date.now(), 30000) },
    { name: "Сайт: стили", run: () => fetchFile("styles.css?check=" + Date.now(), 10000) },
    { name: "Библиотека входа", run: () => fetchFile("vendor/supabase.js?check=" + Date.now(), 100000) },
    { name: "База данных (supabase.co)", run: supabaseHealth },
    { name: "Шрифты (fonts.googleapis.com)", run: () => reach("https://fonts.googleapis.com/css2?family=Onest:wght@400&display=swap") },
  ];

  function withTimeout(promise) {
    return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("нет ответа за 15 с")), TIMEOUT))]);
  }
  // same-site file: must arrive completely (big files are what throttling cuts)
  async function fetchFile(url, minBytes) {
    const res = await withTimeout(fetch(url, { cache: "no-store" }));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await withTimeout(res.text());
    if (text.length < minBytes) throw new Error(`пришло только ${text.length} байт`);
    return `${Math.round(text.length / 1024)} КБ`;
  }
  // other site: an opaque answer is enough to prove it is reachable
  async function reach(url) {
    await withTimeout(fetch(url, { mode: "no-cors", cache: "no-store" }));
    return "доступен";
  }
  async function supabaseHealth() {
    const { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } = await import("./config.js");
    const res = await withTimeout(fetch(`${SUPABASE_URL}/auth/v1/health`, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY }, cache: "no-store" }));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return "доступна";
  }

  const list = document.getElementById("list");
  const rows = tests.map((t) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="st wait">⏳</span> ${t.name} <small></small>`;
    list.appendChild(li);
    return li;
  });
  document.getElementById("meta").textContent =
    `${new Date().toLocaleString("ru-RU")} · ${navigator.userAgent}`;

  // run all tests at the same time; each row updates on its own
  tests.forEach(async (t, i) => {
    const started = performance.now();
    const st = rows[i].querySelector(".st"), note = rows[i].querySelector("small");
    try {
      const info = await t.run();
      st.textContent = "✅"; st.className = "st ok";
      note.textContent = `${info}, ${((performance.now() - started) / 1000).toFixed(1)} с`;
    } catch (e) {
      st.textContent = "❌"; st.className = "st bad";
      // network-level failures come as TypeError ("Failed to fetch" / "Load failed")
      note.textContent = e instanceof TypeError ? "не открывается (блокировка или нет сети)" : (e.message || "не открывается");
    }
  });
</script>
</body>
</html>
